<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0d8">
<title>cc02 log</title>
<style>
  /* Ghibli pastoral: cream sky, sage greens, warm clay */
  :root {
    --bg: #eef0d8;
    --card: #f6f3df;
    --line: #c5cdb5;
    --text: #2a3d3a;
    --muted: #6e7c6a;
    --accent: #c47a5e;
    --ok: #6a8e5e;
    --err: #a85a4a;
    --sky: #b8d4cc;
    --hill: #8aa874;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 14px 80px; }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0 14px; letter-spacing: -0.01em; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  input[type=date], input[type=text], input[type=number], select {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); opacity: 0.55; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat {
    padding: 14px 10px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 15px; text-align: left;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: border-color .15s;
  }
  .cat .sub { color: var(--muted); font-size: 11px; }
  .cat.active { border-color: var(--accent); background: rgba(196, 122, 94, 0.12); }
  .submit {
    width: 100%; padding: 16px; margin-top: 18px; border-radius: 14px; border: 0;
    background: var(--accent); color: #1a0f0a; font-size: 17px; font-weight: 600;
    cursor: pointer;
  }
  .submit:disabled { opacity: 0.4; }
  .status { margin-top: 14px; min-height: 22px; font-size: 14px; text-align: center; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .recent { margin-top: 22px; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; font-size: 13px; color: var(--muted); }
  .recent .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .recent .row + .row { border-top: 1px dashed var(--line); }
  .recent .v { color: var(--text); flex: 1; }
  .recent .undo { background: none; border: 1px solid var(--line); color: var(--muted);
    font-size: 11px; padding: 4px 10px; border-radius: 8px; cursor: pointer; letter-spacing: 0.04em; }
  .recent .undo:hover, .recent .undo:active { color: var(--err); border-color: var(--err); }
  .recent .undo:disabled { opacity: 0.4; cursor: not-allowed; }
  .recent .row.undone .v { text-decoration: line-through; color: var(--muted); }
  /* Ghibli sky: floating cumulus + horizon hill */
  .ghibli-sky-log { position: fixed; top: 0; left: 0; right: 0; height: 200px;
    pointer-events: none; z-index: 0; opacity: 0.50; }
  .ghibli-hills-log { position: fixed; left: 0; right: 0; bottom: 0; height: 90px;
    pointer-events: none; z-index: 0; opacity: 0.32; }
  .totoro-deco { position: fixed; pointer-events: none; z-index: 0;
    left: 66%; top: 80px; width: 64px; height: 100px; opacity: 0.7; }
  .wrap { position: relative; z-index: 1; }
</style>
</head>
<body>

</svg>
<svg class="ghibli-hills-log" viewBox="0 0 1400 90" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M 0 90 L 0 50 Q 200 30 400 45 Q 600 60 800 40 Q 1000 28 1200 48 Q 1300 56 1400 50 L 1400 90 Z"
        fill="#a4be9a" stroke="#5e7d52" stroke-width="1.2"/>
  <path d="M 0 90 L 0 70 Q 250 56 500 70 Q 750 84 1000 68 Q 1200 58 1400 72 L 1400 90 Z"
        fill="#8aa874" stroke="#5e7d52" stroke-width="1.2"/>

<div class="wrap">
  <h1>cc02 log</h1>

  <label>Date</label>
  <input id="date" type="date">

  <div id="cats"></div>

  <label id="value-label">Value</label>
  <input id="value" type="text" autocomplete="off" autocapitalize="off">
  <div id="value-hint" style="font-size:12px;color:var(--muted);margin-top:6px;min-height:16px;"></div>

  <button class="submit" id="submit">Save</button>
  <div class="status" id="status"></div>

  <div class="recent" id="recent" hidden>
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">just saved</div>
    <div id="recent-list"></div>
  </div>
</div>

<script>
const WORKER_BASE = "https://cc02-log.twchou.workers.dev";

const CATEGORIES = [
  // Body
  { name: "Weight morning",  unit: "kg",  type: "number", placeholder: "58.0", suffix: " kg", group: "Body" },
  { name: "Weight night",    unit: "kg",  type: "number", placeholder: "58.7", suffix: " kg", group: "Body" },
  { name: "Sleep",           type: "text", placeholder: "23:00 → 09:00",                       group: "Body" },
  { name: "Steps",           type: "number", placeholder: "11000",                              group: "Body" },
  { name: "Doctor visit",    type: "number", placeholder: "1", default: "1",                    group: "Body" },
  // Habits (text fields capture description after the count)
  { name: "Coffee",          type: "text", placeholder: "1 拿鐵",     group: "Habits" },
  { name: "Alcohol",         type: "text", placeholder: "1 紅酒",     group: "Habits" },
  { name: "Fruit",           type: "text", placeholder: "1 奇異果",   group: "Habits" },
  { name: "Dessert",         type: "text", placeholder: "1 蛋糕",     group: "Habits" },
  { name: "Fried foods",     type: "text", placeholder: "1 炸雞",     group: "Habits" },
  { name: "Refined carbs",   type: "text", placeholder: "1 可頌麵包", group: "Habits" },
  { name: "Bowel movement",  type: "number", placeholder: "1", default: "1", group: "Habits" },
  // Activities — default-1 chips submit with one tap; counted ones need a value
  { name: "Badminton",       type: "number", placeholder: "1", default: "1", group: "Activities" },
  { name: "Trampoline",      type: "number", placeholder: "1", default: "1", group: "Activities" },
  { name: "Dancing",         type: "number", placeholder: "1", default: "1", group: "Activities" },
  { name: "Pilates",         type: "number", placeholder: "1", default: "1", group: "Activities" },
  { name: "Jogging",         type: "number", placeholder: "1", default: "1", group: "Activities" },
  { name: "Wall push",       type: "number", placeholder: "50",              group: "Activities" },
  { name: "Dead hang",       type: "number", placeholder: "60",              group: "Activities" },
  // Schedule — picks an appointment date
  { name: "Doctor visit",    type: "number", placeholder: "1", default: "1", dateFocus: true, group: "Schedule" },
];
const DEFAULT_GROUP = "Body";

const $ = id => document.getElementById(id);
const dateEl = $("date");
const catsEl = $("cats");
const valEl = $("value");
const labelEl = $("value-label");
const hintEl = $("value-hint");
const submitEl = $("submit");
const statusEl = $("status");
const recentEl = $("recent");
const recentListEl = $("recent-list");

let active = CATEGORIES[0];

function pad(n) { return String(n).padStart(2, "0"); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function renderCats() {
  catsEl.innerHTML = "";
  const groups = new Map();
  for (const c of CATEGORIES) {
    const g = c.group || DEFAULT_GROUP;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  }
  for (const [groupName, items] of groups) {
    const label = document.createElement("label");
    label.textContent = groupName;
    catsEl.appendChild(label);
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const c of items) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cat" + (c === active ? " active" : "");
      b.innerHTML = `<span>${c.name}</span>` + (c.unit ? `<span class="sub">${c.unit}</span>` : "");
      b.onclick = () => { active = c; renderCats(); applyCategory(); };
      grid.appendChild(b);
    }
    catsEl.appendChild(grid);
  }
}

function formatHint(c) {
  if (c.default) return `預設 1 次，直接按 Save 即可`;
  if (c.group === "Habits" && c.type === "text") {
    return `格式：[數量] [內容]，例如 ${c.placeholder}`;
  }
  if (c.group === "Activities") {
    return `格式：次數，例如 ${c.placeholder}`;
  }
  if (c.name.startsWith("Weight")) {
    return `格式：公斤數，例如 ${c.placeholder}（自動加上 kg）`;
  }
  if (c.name === "Sleep") {
    return `格式：就寢 → 起床，例如 ${c.placeholder}`;
  }
  if (c.name === "Steps") {
    return `格式：步數，例如 ${c.placeholder}`;
  }
  return "";
}

function applyCategory() {
  if (active.dateFocus) {
    labelEl.textContent = `Value (${active.name}) — set Date above to the appointment date`;
  } else {
    labelEl.textContent = `Value (${active.name})`;
  }
  valEl.type = active.type;
  valEl.placeholder = active.placeholder || "";
  valEl.value = active.default || "";
  hintEl.textContent = formatHint(active);
  if (active.type === "number") {
    valEl.inputMode = "decimal";
    valEl.step = "any";
  } else {
    valEl.removeAttribute("inputmode");
    valEl.removeAttribute("step");
  }
  setTimeout(() => {
    if (active.dateFocus) {
      dateEl.focus({ preventScroll: true });
      if (dateEl.showPicker) { try { dateEl.showPicker(); } catch {} }
    } else if (active.default) {
      // Pre-filled value → focus Save so user can submit with one tap, no keyboard
      submitEl.focus({ preventScroll: true });
    } else {
      valEl.focus({ preventScroll: true });
    }
  }, 0);
}

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function pushRecent(entry) {
  recentEl.hidden = false;
  const row = document.createElement("div");
  row.className = "row";
  const dateSp = document.createElement("span");
  dateSp.textContent = entry.date;
  const v = document.createElement("span");
  v.className = "v";
  v.textContent = `${entry.category}: ${entry.value}`;
  const undoBtn = document.createElement("button");
  undoBtn.type = "button";
  undoBtn.className = "undo";
  undoBtn.textContent = "Undo";
  undoBtn.onclick = () => undoEntry(row, undoBtn, entry);
  row.appendChild(dateSp);
  row.appendChild(v);
  row.appendChild(undoBtn);
  recentListEl.prepend(row);
  while (recentListEl.children.length > 5) recentListEl.lastChild.remove();
}

function buildEntry() {
  const date = dateEl.value;
  const raw = valEl.value.trim();
  if (!raw) return null;
  const category = active.name;
  const value = active.suffix && !raw.endsWith(active.suffix.trim()) ? raw + active.suffix : raw;
  return { date, category, value };
}

const b64u = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)))
  .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64uDecode = s => Uint8Array.from(
  atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)),
  c => c.charCodeAt(0));

async function hmacKey() {
  const keyStr = location.hash.replace(/^#/, "");
  if (!keyStr) throw new Error("URL missing #key");
  const keyBytes = b64uDecode(keyStr);
  return crypto.subtle.importKey(
    "raw", keyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
}

async function signedPost(path, entry) {
  const ts = Date.now();
  const msg = `${ts}.${entry.date}.${entry.category}.${entry.value}`;
  const key = await hmacKey();
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(msg));
  const body = JSON.stringify({ ts, date: entry.date, category: entry.category, value: entry.value, hmac: b64u(sig) });
  return fetch(WORKER_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body,
  });
}

async function submit() {
  const entry = buildEntry();
  if (!entry) { setStatus("Enter a value", "err"); return; }
  if (entry.error) { setStatus(entry.error, "err"); return; }

  submitEl.disabled = true;
  setStatus("Saving…");
  try {
    const r = await signedPost("/entry", entry);
    if (!r.ok) {
      const t = await r.text().catch(() => "");
      throw new Error(`${r.status} ${t || r.statusText}`);
    }
    setStatus(`Saved: ${entry.category} = ${entry.value}`, "ok");
    pushRecent(entry);
    if (!active.default) valEl.value = "";
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) {
    setStatus("Failed: " + (e.message || e), "err");
  } finally {
    submitEl.disabled = false;
  }
}

async function undoEntry(row, undoBtn, entry) {
  undoBtn.disabled = true;
  setStatus("Undoing…");
  try {
    const r = await signedPost("/undo", entry);
    if (!r.ok) {
      const t = await r.text().catch(() => "");
      throw new Error(`${r.status} ${t || r.statusText}`);
    }
    row.classList.add("undone");
    undoBtn.textContent = "Undone";
    setStatus(`Undone: ${entry.category} = ${entry.value}`, "ok");
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (e) {
    undoBtn.disabled = false;
    setStatus("Undo failed: " + (e.message || e), "err");
  }
}

dateEl.value = todayStr();
renderCats();
applyCategory();
submitEl.onclick = submit;
valEl.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
if (!location.hash) setStatus("URL missing #key — request the full link", "err");
</script>
</body>
</html>
